name: 🐦 Swift Module

on:
  pull_request:
    paths:
      - "modules/swift/**"
      - ".github/workflows/swift_module.yml"
  workflow_dispatch:

jobs:
  build-swift-runtime:
    name: Build Swift runtime (swiftgodot_runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build the runtime package
        run: swift build -c release --package-path modules/swift/runtime
      - name: Smoke-test the runtime library exports
        run: |
          LIB=$(find modules/swift/runtime/.build/release -name "libswiftgodot_runtime.so" | head -1)
          test -n "$LIB"
          nm -D "$LIB" | grep -q swiftgodot_runtime_version
          nm -D "$LIB" | grep -q swiftgodot_script_compile
          nm -D "$LIB" | grep -q swiftgodot_instance_create
          UILIB=$(find modules/swift/runtime/.build/release -name "libSwiftGodotUI.so" | head -1)
          test -n "$UILIB"
          nm -D "$UILIB" | grep -q swiftgodot_scene_build
          nm -D "$UILIB" | grep -q swiftgodot_scene_invalidate

  build-engine-with-swift-module:
    name: Build engine with module_swift_enabled=yes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 python3-pip
          pip install scons
      - name: Build (headless template, swift module enabled)
        run: >
          scons platform=linuxbsd target=template_debug module_swift_enabled=yes
          x11=no wayland=no alsa=no pulseaudio=no dbus=no speechd=no fontconfig=no
          udev=no libdecor=no touch=no vulkan=no -j"$(nproc)" progress=no
      - name: Check the swift module archive
        run: ls bin/obj/modules/libmodule_swift.*.a

  regenerate-bindings-check:
    name: Check generated bindings are up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 python3-pip
          pip install scons
      - name: Build editor binary and dump the API
        run: >
          scons platform=linuxbsd target=editor dev_build=yes module_swift_enabled=yes
          x11=no wayland=no alsa=no pulseaudio=no dbus=no speechd=no fontconfig=no
          udev=no libdecor=no touch=no vulkan=no -j"$(nproc)" progress=no
      - name: Dump extension_api.json and regenerate bindings
        run: |
          mkdir -p /tmp/apidump && cd /tmp/apidump
          cp "$GITHUB_WORKSPACE"/bin/godot.linuxbsd.editor.dev.x86_64* godot
          printf 'config_version=5\n\n[application]\n\nconfig/name="apidump"\n' > project.godot
          "$GITHUB_WORKSPACE"/bin/godot.linuxbsd.editor.dev.x86_64* --headless --dump-extension-api
          python3 "$GITHUB_WORKSPACE"/modules/swift/tools/generate_bindings.py --api extension_api.json --all \
            --exclude SwiftViewHost --out /tmp/apidump/GodotBindings.swift
          diff -q /tmp/apidump/GodotBindings.swift "$GITHUB_WORKSPACE"/modules/swift/runtime/Sources/SwiftGodotRuntime/Generated/GodotBindings.swift
